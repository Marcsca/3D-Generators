                else s.lineTo(hw * Math.cos(a), hd * Math.sin(a));
              }
              s.closePath();
            } else {
              s.moveTo(-hw, -hd); s.lineTo(hw, -hd); s.lineTo(hw, hd); s.lineTo(-hw, hd); s.closePath();
            }
            return s;
          };

          if (terrainMode === 'flat') {
            const baseGeo = new THREE.ExtrudeGeometry(createBoundaryShape(sizeX, sizeZ, 0), { depth: baseH, bevelEnabled: false, curveSegments: 48 });
            baseGeo.rotateX(Math.PI / 2);
            baseGeo.translate(0, baseH, 0);
            parts.base.push(baseGeo);
          } else {
            parts.base.push(Map3DEngine.buildSolidTerrainMesh(sizeX, sizeZ, baseH, shapeType, Number(params.terrainMeshRes || 44), getReliefAt));
          }

          const frameMargin = params.showBorderFrame ? Number(params.frameWidth) : 0;
          if (params.showBorderFrame) {
            const outerShape = createBoundaryShape(sizeX, sizeZ, 0);
            outerShape.holes.push(createBoundaryShape(sizeX, sizeZ, frameMargin));
            const fHeight = Number(params.frameHeight);
            const frameGeo = new THREE.ExtrudeGeometry(outerShape, { depth: baseH + fHeight, bevelEnabled: false, curveSegments: 48 });
            frameGeo.rotateX(Math.PI / 2);
            frameGeo.translate(0, baseH + fHeight, 0);
            parts.frame.push(frameGeo);
          }

          const usableRatio = Math.max(0.7, (sizeX - frameMargin * 2.1) / sizeX);
          const createElevatedPolygonGeo = (pts, height, sink = 0.8) => {
            if (pts.length < 3) return null;
            let cx = 0, cz = 0;
            pts.forEach(([px, pz]) => { cx += px; cz += pz; });
            cx /= pts.length; cz /= pts.length;
            if (!Map3DEngine.isPointInsideShape(cx, cz, shapeType, usableRatio)) return null;
            const polyShape = new THREE.Shape();
            pts.forEach(([nx, nz], idx) => {
              const x = nx * sizeX * usableRatio, y = nz * sizeZ * usableRatio;
              if (idx === 0) polyShape.moveTo(x, y); else polyShape.lineTo(x, y);
            });
            polyShape.closePath();
            const groundY = baseH + getReliefAt(cx, cz);
            const geo = new THREE.ExtrudeGeometry(polyShape, { depth: height + sink, bevelEnabled: false });
            geo.rotateX(Math.PI / 2);
            geo.translate(0, groundY + height, 0);
            return geo;
          };

          if (params.showWater && mapData.water) mapData.water.forEach(p => { const g = createElevatedPolygonGeo(p, 0.35, 0.8); if (g) parts.water.push(g); });
          if (params.showParks && mapData.parks) mapData.parks.forEach(p => { const g = createElevatedPolygonGeo(p, Number(params.parkReliefHeight), 0.8); if (g) parts.parks.push(g); });

          if (params.showRoads && mapData.roads) {
            const roadH = Number(params.roadReliefHeight), widthMult = Number(params.roadWidthMultiplier);
            mapData.roads.forEach(road => {
              if (params.detailLevel === 'low' && road.type !== 'primary') return;
              if (params.detailLevel === 'medium' && road.type === 'minor') return;
              const roadW = (road.type === 'primary' ? 2.4 : road.type === 'secondary' ? 1.6 : 1.0) * widthMult;
              const pts = road.points;
              for (let i = 0; i < pts.length - 1; i++) {
                const [nx1, nz1] = pts[i], [nx2, nz2] = pts[i + 1];
                if (!Map3DEngine.isPointInsideShape((nx1 + nx2) / 2, (nz1 + nz2) / 2, shapeType, usableRatio)) continue;
                const x1 = nx1 * sizeX * usableRatio, z1 = -nz1 * sizeZ * usableRatio;
                const x2 = nx2 * sizeX * usableRatio, z2 = -nz2 * sizeZ * usableRatio;
                const y1 = baseH + getReliefAt(nx1, nz1), y2 = baseH + getReliefAt(nx2, nz2);
                const dx = x2 - x1, dz = z2 - z1, dy = y2 - y1, planarLen = Math.hypot(dx, dz);
                if (planarLen < 0.3) continue;
                const segGeo = new THREE.BoxGeometry(Math.hypot(planarLen, dy) + roadW * 0.4, roadH + 0.8, roadW);
                segGeo.rotateZ(Math.atan2(dy, planarLen));
                segGeo.rotateY(-Math.atan2(dz, dx));
                segGeo.translate((x1 + x2) / 2, (y1 + y2) / 2 + (roadH - 0.8) / 2, (z1 + z2) / 2);
                parts.roads.push(segGeo);
              }
            });
          }

          if (params.showBuildings && mapData.buildings) {
            const hScale = Number(params.buildingHeightScale);
            mapData.buildings.forEach((b, idx) => {
              if (params.detailLevel === 'low' && b.heightMeters < 11 && idx % 2 === 0) return;
              const g = createElevatedPolygonGeo(b.footprint, Math.max(1.6, b.heightMeters * 0.45 * hScale), 2.2);
              if (g) parts.buildings.push(g);
            });
          }

          if (params.showPlaque && (params.plaqueText.trim() !== '' || params.plaqueSubtext.trim() !== '')) {
            const titleStr = params.plaqueText.trim(), subStr = params.plaqueSubtext.trim(), hasSub = subStr.length > 0;
            const textSize = Number(params.plaqueTextSize), subSize = Math.max(2.6, textSize * 0.52), textRelief = Number(params.plaqueTextRelief);
            const plaqueW = sizeX * Number(params.plaqueWidthRatio), plaqueDepthZ = hasSub ? (textSize + subSize + 8.5) : (textSize + 6.5);
            const plaqueH = baseH + (params.showBorderFrame ? Number(params.frameHeight) : 1.8);
            const frontEdgeZ = (shapeType === 'hexagon') ? (sizeZ * 0.433) : (sizeZ / 2);
            const plaqueCenterZ = (params.plaqueStyle === 'front-tab') ? (frontEdgeZ + plaqueDepthZ / 2 - 1.5) : (frontEdgeZ - plaqueDepthZ / 2 - (frameMargin * 0.4));

            const pShape = new THREE.Shape(), pw = plaqueW / 2, pd = plaqueDepthZ / 2, r = Math.min(3.5, pd * 0.4);
            pShape.moveTo(-pw + r, -pd); pShape.lineTo(pw - r, -pd); pShape.quadraticCurveTo(pw, -pd, pw, -pd + r);
            pShape.lineTo(pw, pd - r); pShape.quadraticCurveTo(pw, pd, pw - r, pd); pShape.lineTo(-pw + r, pd);
            pShape.quadraticCurveTo(-pw, pd, -pw, pd - r); pShape.lineTo(-pw, -pd + r); pShape.quadraticCurveTo(-pw, -pd, -pw + r, -pd);

            const plaqueGeo = new THREE.ExtrudeGeometry(pShape, { depth: plaqueH, bevelEnabled: false, curveSegments: 16 });
            plaqueGeo.rotateX(Math.PI / 2);
            plaqueGeo.translate(0, plaqueH, plaqueCenterZ);
            parts.frame.push(plaqueGeo);

            if (state.loadedFont) {
              const buildCenteredText = (str, size, zOffset) => {
                if (!str) return;
                const tGeo = new TextGeometry(str, { font: state.loadedFont, size, height: textRelief + 0.4, curveSegments: 6, bevelEnabled: false });
                tGeo.computeBoundingBox();
                const bb = tGeo.boundingBox;
                tGeo.translate(-(bb.max.x - bb.min.x) / 2, -(bb.max.y - bb.min.y) / 2, 0);
                tGeo.rotateX(-Math.PI / 2);
                tGeo.translate(0, plaqueH - 0.3, plaqueCenterZ + zOffset);
                parts.text.push(tGeo);
              };
              if (titleStr && hasSub) { buildCenteredText(titleStr, textSize, -subSize * 0.7); buildCenteredText(subStr, subSize, textSize * 0.65); }
              else if (titleStr) buildCenteredText(titleStr, textSize, 0);
              else if (hasSub) buildCenteredText(subStr, subSize, 0);
            }
          }

          const colorMap = { base: params.colorBase, water: params.colorWater, parks: params.colorParks, roads: params.colorRoads, buildings: params.colorBuildings, frame: params.colorFrame, text: params.colorPlaqueText };
          Object.keys(parts).forEach(partName => {
            if (parts[partName].length === 0) return;
            const merged = safeMergeGeometries(parts[partName]);
            if (!merged) return;
            const m = new THREE.Mesh(merged, new THREE.MeshStandardMaterial({ color: new THREE.Color(colorMap[partName]), roughness: 0.38, metalness: 0.1 }));
            m.name = partName; m.castShadow = true; m.receiveShadow = true;
            group.add(m);
          });
          return group;
        }
      },

      // --------------------------------------------------------------------------
      // GENERATORE 3: SOUNDWAVE 3D (MP3 to STL)
      // --------------------------------------------------------------------------
      {
        id: 'soundwave-3d',
        title: 'Soundwave 3D (MP3 to STL)',
        category: 'Audio & Art',
        icon: 'audio-waveform',
        status: 'ready',
        supportsMultiColorExport: false,
        defaultParams: {
          barsCount: 65,
          totalLength: 140,
          barDepth: 10,
          maxBarHeight: 32,
          minBarHeight: 2.5,
          barGapRatio: 0.25,
          waveStyle: 'symmetric',
          plateOrientation: 'horizontal-on-plate', // 'horizontal-on-plate', 'horizontal-on-base', 'vertical-on-plate', 'vertical-stand'
          hasBase: true,
          baseThickness: 3,
          baseMarginX: 6,
          baseMarginY: 4,
          keychainHole: false,
          holeDiameter: 4.5,
          exponentCurve: 1.0,
          modelColor: '#3b82f6'
        },
        schema: [
          { type: 'file-audio', key: 'audioFile', label: 'Carica File Audio (MP3 / WAV)' },
          { type: 'header', label: 'Orientamento sul Piatto & Stile Onda' },
          { type: 'select', key: 'plateOrientation', label: 'Orientamento Onda sul Piatto di Stampa', options: [
            { value: 'horizontal-on-plate', label: 'Sdraiata sul Piatto (Tutta l\'onda tocca il piatto XY)' },
            { value: 'horizontal-on-base', label: 'Sdraiata sopra Piastra di Base (Rilievo Orizzontale)' },
            { value: 'vertical-on-plate', label: 'Verticale a Contatto col Piatto (Cresce in Altezza Z)' },
            { value: 'vertical-stand', label: 'Verticale Sospesa su Piedistallo (Con Pilastrini)' }
          ]},
          { type: 'select', key: 'waveStyle', label: 'Stile Profilo Onda', options: [
            { value: 'symmetric', label: 'Simmetrica Doppia (Stile Equalizzatore)' },
            { value: 'flat', label: 'Singola Unilaterale (Metà Superiore)' }
          ]},
          { type: 'range', key: 'barsCount', label: 'Numero di Barre', min: 15, max: 180, step: 1, unit: '' },
          { type: 'range', key: 'totalLength', label: 'Lunghezza Onda (X)', min: 40, max: 250, step: 1, unit: 'mm' },
          { type: 'range', key: 'maxBarHeight', label: 'Ampiezza Max Picchi Onda', min: 8, max: 85, step: 1, unit: 'mm' },
          { type: 'range', key: 'minBarHeight', label: 'Ampiezza Minima Silenzio', min: 1.0, max: 15, step: 0.2, unit: 'mm' },
          { type: 'range', key: 'barDepth', label: 'Spessore / Profondità Barre', min: 2, max: 40, step: 0.5, unit: 'mm' },
          { type: 'range', key: 'barGapRatio', label: 'Spazio tra le Barre', min: 0.0, max: 0.75, step: 0.05, unit: 'x' },
          { type: 'range', key: 'exponentCurve', label: 'Contrasto Dinamico Picchi', min: 0.4, max: 2.5, step: 0.1, unit: 'γ' },
          { type: 'header', label: 'Base & Portachiavi' },
          { type: 'checkbox', key: 'hasBase', label: 'Aggiungi Base / Barra di Supporto' },
          { type: 'range', key: 'baseThickness', label: 'Spessore Base', min: 1.2, max: 12, step: 0.4, unit: 'mm' },
          { type: 'range', key: 'baseMarginX', label: 'Margine Lunghezza (X)', min: 0, max: 25, step: 1, unit: 'mm' },
          { type: 'range', key: 'baseMarginY', label: 'Margine Larghezza (Y)', min: 0, max: 20, step: 0.5, unit: 'mm' },
          { type: 'checkbox', key: 'keychainHole', label: 'Aggiungi Anello Portachiavi' },
          { type: 'range', key: 'holeDiameter', label: 'Diametro Foro', min: 2.5, max: 8, step: 0.5, unit: 'mm' },
          { type: 'header', label: 'Colore Anteprima' },
          { type: 'color', key: 'modelColor', label: 'Colore Filamento' }
        ],
        buildGeometry: (params, state) => {
          const geometries = [];
          const count = Number(params.barsCount);
          const peaks = state.rawAudioChannelData
            ? AudioWaveformProcessor.computePeaksFromChannelData(state.rawAudioChannelData, count)
            : AudioWaveformProcessor.generateDemoPeaks(count);

          const totalLen = Number(params.totalLength);
          const depth = Number(params.barDepth);
          const maxH = Number(params.maxBarHeight);
          const minH = Number(params.minBarHeight);
          const gapRatio = Number(params.barGapRatio);
          const gamma = Number(params.exponentCurve);
          const baseThick = Number(params.baseThickness);
          const orient = params.plateOrientation || 'horizontal-on-plate';
          const isSymmetric = params.waveStyle === 'symmetric';

          const pitch = totalLen / count;
          const barWidth = Math.max(0.4, pitch * (1 - gapRatio));
          const startX = -totalLen / 2 + pitch / 2;

          const isHorizontal = (orient === 'horizontal-on-plate' || orient === 'horizontal-on-base');
          // Se è horizontal-on-base, la piastra di base sta sotto (Y=0..baseThick) e l'onda poggia sopra;
          // se è horizontal-on-plate, TUTTA l'onda poggia direttamente sul piatto di stampa (Y=0..depth)!
          const yBottomWave = (orient === 'horizontal-on-base' && params.hasBase) ? baseThick : 0;

          for (let i = 0; i < count; i++) {
            const h = minH + Math.pow(peaks[i] || 0, gamma) * (maxH - minH);
            const cx = startX + i * pitch;

            if (isHorizontal) {
              // Onda sdraiata sul piatto: lo spessore verticale è 'depth' (Y), i picchi si estendono sul piano XZ (Z)
              const barGeo = new THREE.BoxGeometry(barWidth, depth, h);
              const cz = isSymmetric ? 0 : (-h / 2);
              barGeo.translate(cx, yBottomWave + depth / 2, cz);
              geometries.push(barGeo);
            } else if (orient === 'vertical-on-plate') {
              // Onda verticale che poggia direttamente sul piatto (o sulla base piatta) senza restare sospesa
              const yStart = params.hasBase ? baseThick : 0;
              const barGeo = new THREE.BoxGeometry(barWidth, h, depth);
              barGeo.translate(cx, yStart + h / 2, 0);
              geometries.push(barGeo);
            } else {
              // vertical-stand: Onda verticale simmetrica sospesa a mezz'aria con piedistallo
              const centerElevation = maxH / 2 + (params.hasBase ? baseThick : 0);
              const barGeo = new THREE.BoxGeometry(barWidth, h, depth);
              barGeo.translate(cx, centerElevation, 0);
              geometries.push(barGeo);
            }
          }

          // Spina centrale di unione quando l'onda è sdraiata sul piatto (così le barre non si separano mai!)
          if (isHorizontal) {
            const spineW = Math.min(minH, 2.6);
            const spineZ = isSymmetric ? 0 : (-spineW / 2);
            const spineGeo = new THREE.BoxGeometry(totalLen, depth, spineW);
            spineGeo.translate(0, yBottomWave + depth / 2, spineZ);
            geometries.push(spineGeo);
          }

          // Costruzione Base in base all'orientamento scelto
          if (params.hasBase) {
            const baseW = totalLen + Number(params.baseMarginX) * 2;
            if (orient === 'horizontal-on-plate') {
              // Barra di base sul bordo inferiore dell'onda, anch'essa appoggiata direttamente sul piatto (Y=0..depth)
              const edgeZ = isSymmetric ? (maxH / 2 + baseThick / 2) : (baseThick / 2);
              const bottomBarGeo = new THREE.BoxGeometry(baseW, depth, baseThick);
              bottomBarGeo.translate(0, depth / 2, edgeZ);
              geometries.push(bottomBarGeo);

              // Se le barre sono corte ai lati, colleghiamo la spina centrale o le barre alla base
              if (isSymmetric) {
                const pillarW = Math.max(3, totalLen * 0.035);
                const p1 = new THREE.BoxGeometry(pillarW, depth, maxH / 2 + baseThick / 2);
                p1.translate(-totalLen * 0.32, depth / 2, (maxH / 2 + baseThick / 2) / 2);
                const p2 = new THREE.BoxGeometry(pillarW, depth, maxH / 2 + baseThick / 2);
                p2.translate(totalLen * 0.32, depth / 2, (maxH / 2 + baseThick / 2) / 2);
                geometries.push(p1, p2);
              }
            } else if (orient === 'horizontal-on-base') {
              // Piastra di base piatta sotto tutta l'onda sdraiata (perfetta anche per cambio colore a layer!)
              const spanZ = maxH + Number(params.baseMarginY) * 2;
              const centerZ = isSymmetric ? 0 : (-maxH / 2);
              const plateGeo = new THREE.BoxGeometry(baseW, baseThick, spanZ);
              plateGeo.translate(0, baseThick / 2, centerZ);
              geometries.push(plateGeo);
            } else if (orient === 'vertical-on-plate') {
              // Piastra di base piatta sotto l'onda verticale
              const baseD = depth + Number(params.baseMarginY) * 2;
              const baseGeo = new THREE.BoxGeometry(baseW, baseThick, baseD);
              baseGeo.translate(0, baseThick / 2, 0);
              geometries.push(baseGeo);
            } else {
              // vertical-stand: Piedistallo inferiore + 2 pilastrini + spina centrale sospesa
              const baseD = depth + Number(params.baseMarginY) * 2;
              const centerElevation = maxH / 2 + baseThick;
              const spineGeo = new THREE.BoxGeometry(totalLen, Math.min(minH, 3), depth * 0.6);
              spineGeo.translate(0, centerElevation, 0);
              const standGeo = new THREE.BoxGeometry(baseW, baseThick, baseD);
              standGeo.translate(0, baseThick / 2, 0);
              const pillarW = Math.max(3, totalLen * 0.04);
              const p1 = new THREE.BoxGeometry(pillarW, centerElevation, depth * 0.6);
              p1.translate(-totalLen * 0.32, centerElevation / 2, 0);
              const p2 = new THREE.BoxGeometry(pillarW, centerElevation, depth * 0.6);
              p2.translate(totalLen * 0.32, centerElevation / 2, 0);
              geometries.push(spineGeo, standGeo, p1, p2);
            }
          }

          // Anello Portachiavi (sempre a contatto col piatto Y=0)
          if (params.keychainHole) {
            const holeR = Number(params.holeDiameter) / 2;
            const outerR = holeR + 2.8;
            const tabThick = isHorizontal ? (orient === 'horizontal-on-base' && params.hasBase ? baseThick : depth) : (params.hasBase ? baseThick : Math.min(4, minH));

            const ringShape = new THREE.Shape();
            ringShape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
            const holePath = new THREE.Path();
            holePath.absarc(0, 0, holeR, 0, Math.PI * 2, true);
            ringShape.holes.push(holePath);

            const ringGeo = new THREE.ExtrudeGeometry(ringShape, { depth: tabThick, bevelEnabled: false, curveSegments: 32 });
            ringGeo.rotateX(-Math.PI / 2);

            const leftEdgeX = -(totalLen / 2 + (params.hasBase && orient !== 'horizontal-on-plate' ? Number(params.baseMarginX) : 0));
            const ringZ = (!isHorizontal || isSymmetric) ? 0 : (-minH / 2);
            ringGeo.translate(leftEdgeX - outerR + 1.4, 0, ringZ);
            geometries.push(ringGeo);
          }

          const merged = safeMergeGeometries(geometries);
          const mesh = new THREE.Mesh(
            merged || new THREE.BoxGeometry(10, 2, 10),
            new THREE.MeshStandardMaterial({ color: new THREE.Color(params.modelColor), roughness: 0.35, metalness: 0.1 })
          );
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          return mesh;
        }
      }
    ];

    // ============================================================================
    // 5. APPLICAZIONE PRINCIPALE (ANTEPRIMA 3D SEMPRE ATTIVA)
    // ============================================================================
    const FONT_URLS = {
      helvetiker_bold: 'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
      helvetiker_regular: 'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_regular.typeface.json',
      optimer_bold: 'https://unpkg.com/three@0.160.0/examples/fonts/optimer_bold.typeface.json',
      gentilis_bold: 'https://unpkg.com/three@0.160.0/examples/fonts/gentilis_bold.typeface.json',
      droid_sans_bold: 'https://unpkg.com/three@0.160.0/examples/fonts/droid/droid_sans_bold.typeface.json'
    };

    class MakerStudioApp {
      constructor() {
        this.activeTool = null;
        this.currentParams = {};
        this.appState = {
          rawAudioChannelData: null,
          audioFileName: 'Onda Sonora Demo',
          mapData: Map3DEngine.generateDemoCityData(),
          loadedFont: null,
          fonts: {},
          customSvgText: null,
          customRasterImage: null,
          customGraphicName: 'Icona Razzo (Preset)'
        };

        this.tabsContainer = document.getElementById('top-generator-tabs');
        this.controlsContainer = document.getElementById('ws-controls-container');
        this.bboxInfo = document.getElementById('ws-bbox-info');
        this.btnExportMulti = document.getElementById('btn-export-multicolor');
        this.mapDrawer = document.getElementById('map-picker-drawer');

        this.initThreeViewport();
        this.initTopTabs();
        this.initEvents();
        // Apriamo immediatamente il Portachiavi & Badge Studio Pro all'avvio!
        this.openGenerator('keychain-tag');
        this.preloadFonts();
        lucide.createIcons();
      }

      preloadFonts() {
        const loader = new FontLoader();
        Object.entries(FONT_URLS).forEach(([key, url]) => {
          loader.load(url, (font) => {
            this.appState.fonts[key] = font;
            if (key === 'helvetiker_bold') this.appState.loadedFont = font;
            if (this.activeTool) this.rebuild3DModel();
          });
        });
      }

      initTopTabs() {
        this.tabsContainer.innerHTML = '';
        GENERATORS.forEach(tool => {
          const btn = document.createElement('button');
          btn.dataset.toolId = tool.id;
          btn.className = 'tab-btn flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold transition shrink-0 border';
          btn.innerHTML = `<i data-lucide="${tool.icon}" class="w-4 h-4"></i><span>${tool.title}</span>`;
          btn.addEventListener('click', () => this.openGenerator(tool.id));
          this.tabsContainer.appendChild(btn);
        });
      }

      updateTabStyles() {
        this.tabsContainer.querySelectorAll('.tab-btn').forEach(btn => {
          const isActive = btn.dataset.toolId === this.activeTool?.id;
          btn.className = `tab-btn flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold transition shrink-0 border ${
            isActive
              ? 'bg-blue-600 text-white border-blue-500 shadow-lg shadow-blue-600/25'
              : 'bg-gray-800/80 text-gray-300 border-gray-700 hover:bg-gray-800 hover:text-white'
          }`;
        });
      }

      initThreeViewport() {
        const container = document.getElementById('viewport-container');
        this.scene = new THREE.Scene();

        this.camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 1, 2500);
        this.camera.position.set(0, 110, 125);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(container.clientWidth, container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        container.appendChild(this.renderer.domElement);

        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.06;
        this.controls.target.set(0, 2, 0);

        this.scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.3);
        dirLight1.position.set(90, 190, 130);
        dirLight1.castShadow = true;
        this.scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x60a5fa, 0.5);
        dirLight2.position.set(-110, 90, -90);
        this.scene.add(dirLight2);

        const buildPlateGrid = new THREE.GridHelper(256, 16, 0x3b82f6, 0x1f2937);
        this.scene.add(buildPlateGrid);

        window.addEventListener('resize', () => this.onWindowResize());

        const animate = () => {
          requestAnimationFrame(animate);
          this.controls.update();
          this.renderer.render(this.scene, this.camera);
        };
        animate();
      }

      onWindowResize() {
        if (!this.renderer) return;
        const container = document.getElementById('viewport-container');
        if (container.clientWidth === 0) return;
        this.camera.aspect = container.clientWidth / container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(container.clientWidth, container.clientHeight);
      }

      toggleSplitMapDrawer(forceOpen) {
        const isHidden = this.mapDrawer.classList.contains('hidden');
        const shouldOpen = forceOpen !== undefined ? forceOpen : isHidden;

        if (shouldOpen) {
          this.mapDrawer.classList.remove('hidden');
          this.mapDrawer.classList.add('flex');
          this.initLeafletMap();
        } else {
          this.mapDrawer.classList.add('hidden');
          this.mapDrawer.classList.remove('flex');
        }
        setTimeout(() => this.onWindowResize(), 50);
      }

      initLeafletMap() {
        if (this.leafletMap) {
          setTimeout(() => this.leafletMap.invalidateSize(), 100);
          this.updateMapCropFrameShape();
          return;
        }
        this.leafletMap = L.map('leaflet-map', { zoomControl: true }).setView([45.0703, 7.6869], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(this.leafletMap);
        this.updateMapCropFrameShape();
      }

      updateMapCropFrameShape() {
        const frameEl = document.getElementById('map-crop-frame');
        if (!frameEl) return;
        const shape = this.currentParams.frameShape || 'rectangle';
        const sx = Number(this.currentParams.sizeX || 140);
        const sy = shape === 'rectangle' ? Number(this.currentParams.sizeY || 115) : sx;
        const basePx = 210;
        const ratio = sy / sx;
        frameEl.style.width = `${basePx}px`;
        frameEl.style.height = `${Math.round(basePx * ratio)}px`;
        frameEl.style.borderRadius = shape === 'circle' ? '9999px' : '12px';
        frameEl.style.clipPath = shape === 'hexagon' ? 'polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%)' : 'none';
      }

      openGenerator(toolId) {
        const tool = GENERATORS.find(t => t.id === toolId);
        if (!tool) return;

        this.activeTool = tool;
        this.currentParams = { ...tool.defaultParams };
        this.updateTabStyles();

        if (toolId !== '3d-city-map') {
          this.toggleSplitMapDrawer(false);
        }

        if (tool.supportsMultiColorExport) {
          this.btnExportMulti.classList.remove('hidden');
          this.btnExportMulti.classList.add('flex');
        } else {
          this.btnExportMulti.classList.add('hidden');
          this.btnExportMulti.classList.remove('flex');
        }

        document.getElementById('ws-tool-category').textContent = tool.category;
        document.getElementById('ws-tool-title').textContent = tool.title;

        // Adatta distanza camera allo strumento
        if (toolId === 'keychain-tag') {
          this.camera.position.set(0, 95, 85);
          this.controls.target.set(0, 2, 0);
        } else {
          this.camera.position.set(0, 135, 185);
          this.controls.target.set(0, 6, 0);
        }
        this.controls.update();

        this.buildSidebarControls(tool);
        this.rebuild3DModel();
        lucide.createIcons();
      }

      buildSidebarControls(tool) {
        this.controlsContainer.innerHTML = '';
        const statusLabel = document.getElementById('status-badge-label');

        tool.schema.forEach(item => {
          if (item.type === 'header') {
            const h = document.createElement('div');
            h.className = 'pt-3 pb-1 border-b border-gray-800 text-[11px] font-bold uppercase tracking-wider text-blue-400';
            h.textContent = item.label;
            this.controlsContainer.appendChild(h);
            return;
          }

          // UPLOADER SVG / PNG / JPG PER PORTACHIAVI CON ANTEPRIMA 2D INTEGRATA
          if (item.type === 'keychain-graphic-uploader') {
            const box = document.createElement('div');
            box.className = 'p-3 rounded-xl bg-gray-800/80 border border-gray-700 space-y-2.5';
            box.innerHTML = `
              <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-gray-200">${item.label}</span>
                <span class="text-[10px] font-mono text-emerald-400" id="graphic-source-badge">${this.appState.customGraphicName}</span>
              </div>
              <input type="file" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp" id="input-keychain-graphic"
                class="block w-full text-xs text-gray-300 file:mr-2.5 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
              <div class="flex items-center gap-3 pt-1">
                <canvas id="raster-preview-canvas" width="48" height="48" class="w-12 h-12 rounded-lg bg-gray-900 border border-gray-700 shrink-0 object-contain"></canvas>
                <p class="text-[11px] text-gray-400 leading-tight">
                  Supporta vettori <strong class="text-gray-200">.SVG</strong> e loghi <strong class="text-gray-200">.PNG/.JPG</strong> (convertiti automaticamente in rilievo 3D).
                </p>
              </div>
            `;

            const fileInput = box.querySelector('#input-keychain-graphic');
            const badge = box.querySelector('#graphic-source-badge');

            fileInput.addEventListener('change', async (e) => {
              const file = e.target.files[0];
              if (!file) return;
              this.appState.customGraphicName = file.name;
              badge.textContent = file.name;
              statusLabel.textContent = `Logo: ${file.name}`;

              if (file.name.toLowerCase().endsWith('.svg') || file.type === 'image/svg+xml') {
                this.appState.customSvgText = await file.text();
                this.currentParams.graphicSource = 'svg-upload';
                this.rebuild3DModel();
              } else {
                const reader = new FileReader();
                reader.onload = (ev) => {
                  const img = new Image();
                  img.onload = () => {
                    this.appState.customRasterImage = img;
                    this.currentParams.graphicSource = 'raster-upload';
                    this.rebuild3DModel();
                  };
                  img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
              }
            });

            this.controlsContainer.appendChild(box);
            return;
          }

          if (item.type === 'map-picker-button') {
            const elev = this.appState.mapData.elevationGrid;
            const elevInfo = elev ? `Δ Quota: ${Math.round(elev.maxElev - elev.minElev)}m` : '';
            const box = document.createElement('div');
            box.className = 'p-3 rounded-xl bg-blue-950/40 border border-blue-500/30 space-y-2';
            box.innerHTML = `
              <div class="flex items-center justify-between text-xs">
                <span class="font-semibold text-blue-200">${this.appState.mapData.sourceName}</span>
                <span class="font-mono text-[11px] text-emerald-400">${elevInfo}</span>
              </div>
              <button type="button" id="btn-open-map-picker" class="w-full py-2 px-3 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white flex items-center justify-center gap-2 shadow transition">
                <i data-lucide="columns-2" class="w-4 h-4"></i>
                Mostra/Nascondi Mappa 2D Affiancata
              </button>
            `;
            box.querySelector('#btn-open-map-picker').addEventListener('click', () => this.toggleSplitMapDrawer());
            this.controlsContainer.appendChild(box);
            return;
          }

          if (item.type === 'text') {
            const val = this.currentParams[item.key] ?? '';
            const div = document.createElement('div');
            div.className = 'space-y-1';
            div.innerHTML = `
              <label class="block text-xs text-gray-300">${item.label}</label>
              <input type="text" value="${val}" placeholder="${item.placeholder || ''}"
                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500" />
            `;
            div.querySelector('input').addEventListener('input', (e) => {
              this.currentParams[item.key] = e.target.value;
              this.rebuild3DModel();
            });
            this.controlsContainer.appendChild(div);
            return;
          }

          if (item.type === 'file-audio') {
            const wrapper = document.createElement('div');
            wrapper.className = 'p-3 rounded-xl bg-gray-800/70 border border-gray-700/80 space-y-2';
            wrapper.innerHTML = `
              <label class="block text-xs font-semibold text-gray-200">${item.label}</label>
              <input type="file" accept="audio/*" class="block w-full text-xs text-gray-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
            `;
            wrapper.querySelector('input').addEventListener('change', async (e) => {
              const file = e.target.files[0];
              if (!file) return;
              const arrayBuffer = await file.arrayBuffer();
              const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
              this.appState.rawAudioChannelData = audioBuffer.getChannelData(0);
              this.appState.audioFileName = file.name;
              statusLabel.textContent = file.name;
              this.rebuild3DModel();
            });
            this.controlsContainer.appendChild(wrapper);
            return;
          }

          if (item.type === 'range') {
            const val = this.currentParams[item.key];
            const div = document.createElement('div');
            div.className = 'space-y-1';
            div.innerHTML = `
              <div class="flex justify-between text-xs">
                <label class="text-gray-300">${item.label}</label>
                <span class="font-mono text-blue-400 font-semibold" id="val-${item.key}">${val}${item.unit}</span>
              </div>
              <input type="range" min="${item.min}" max="${item.max}" step="${item.step}" value="${val}"
                class="w-full h-1.5 bg-gray-800 rounded-lg appearance-none cursor-pointer" />
            `;
            const input = div.querySelector('input');
            const valSpan = div.querySelector(`#val-${item.key}`);
            input.addEventListener('input', (e) => {
              this.currentParams[item.key] = parseFloat(e.target.value);
              valSpan.textContent = `${e.target.value}${item.unit}`;
              this.updateMapCropFrameShape();
              this.rebuild3DModel();
            });
            this.controlsContainer.appendChild(div);
            return;
          }

          if (item.type === 'select') {
            const val = this.currentParams[item.key];
            const div = document.createElement('div');
            div.className = 'space-y-1';
            const optionsHtml = item.options.map(opt => `<option value="${opt.value}" ${opt.value === val ? 'selected' : ''}>${opt.label}</option>`).join('');
            div.innerHTML = `
              <label class="block text-xs text-gray-300">${item.label}</label>
              <select class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
                ${optionsHtml}
              </select>
            `;
            div.querySelector('select').addEventListener('change', (e) => {
              this.currentParams[item.key] = e.target.value;
              if (item.key === 'presetIcon') {
                this.currentParams.graphicSource = 'preset';
                this.appState.customGraphicName = `Icona: ${e.target.value}`;
                const badge = document.getElementById('graphic-source-badge');
                if (badge) badge.textContent = this.appState.customGraphicName;
              }
              this.updateMapCropFrameShape();
              this.rebuild3DModel();
            });
            this.controlsContainer.appendChild(div);
            return;
          }

          if (item.type === 'checkbox') {
            const val = this.currentParams[item.key];
            const div = document.createElement('label');
            div.className = 'flex items-center justify-between py-0.5 cursor-pointer';
            div.innerHTML = `
              <span class="text-xs text-gray-300 font-medium">${item.label}</span>
              <input type="checkbox" ${val ? 'checked' : ''} class="w-4 h-4 rounded accent-blue-600 cursor-pointer" />
            `;
            div.querySelector('input').addEventListener('change', (e) => {
              this.currentParams[item.key] = e.target.checked;
              this.rebuild3DModel();
            });
            this.controlsContainer.appendChild(div);
            return;
          }

          if (item.type === 'color') {
            const val = this.currentParams[item.key];
            const div = document.createElement('div');
            div.className = 'flex items-center justify-between';
            div.innerHTML = `
              <label class="text-xs text-gray-300">${item.label}</label>
              <input type="color" value="${val}" class="w-7 h-7 rounded cursor-pointer bg-transparent border-0" />
            `;
            div.querySelector('input').addEventListener('input', (e) => {
              this.currentParams[item.key] = e.target.value;
              this.rebuild3DModel();
            });
            this.controlsContainer.appendChild(div);
          }
        });
      }

      rebuild3DModel() {
        if (!this.activeTool || !this.scene) return;

        if (this.currentMesh) {
          this.scene.remove(this.currentMesh);
          this.currentMesh.traverse(child => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
          });
        }

        this.currentMesh = this.activeTool.buildGeometry(this.currentParams, this.appState);
        this.scene.add(this.currentMesh);

        const box = new THREE.Box3().setFromObject(this.currentMesh);
        const size = new THREE.Vector3();
        box.getSize(size);
        this.bboxInfo.textContent = `${size.x.toFixed(1)} × ${size.z.toFixed(1)} × ${size.y.toFixed(1)} mm`;
      }

      exportSingleSTL() {
        if (!this.currentMesh) return;
        const clone = this.currentMesh.clone(true);
        clone.traverse(child => {
          if (child.isMesh && child.geometry) {
            child.geometry = child.geometry.clone();
            child.geometry.rotateX(Math.PI / 2);
          }
        });
        clone.updateMatrixWorld(true);
        const exporter = new STLExporter();
        this.triggerDownload(exporter.parse(clone, { binary: true }), `${this.activeTool.id}_completo.stl`);
      }

      exportMultiColorSTL() {
        if (!this.currentMesh) return;
        const exporter = new STLExporter();
        this.currentMesh.children.forEach((partMesh, idx) => {
          if (!partMesh.isMesh) return;
          const tempMesh = partMesh.clone();
          tempMesh.geometry = partMesh.geometry.clone();
          tempMesh.geometry.rotateX(Math.PI / 2);
          tempMesh.updateMatrixWorld(true);
          const stlBuffer = exporter.parse(tempMesh, { binary: true });
          const partName = partMesh.name || `parte_${idx}`;
          setTimeout(() => {
            this.triggerDownload(stlBuffer, `${this.activeTool.id}_${partName}.stl`);
          }, idx * 240);
        });
      }

      triggerDownload(buffer, filename) {
        const blob = new Blob([buffer], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
      }

      initEvents() {
        document.getElementById('btn-reset-params').addEventListener('click', () => {
          if (!this.activeTool) return;
          this.currentParams = { ...this.activeTool.defaultParams };
          this.buildSidebarControls(this.activeTool);
          this.rebuild3DModel();
        });

        document.getElementById('btn-view-top').addEventListener('click', () => {
          this.camera.position.set(0, 145, 0.1);
          this.controls.target.set(0, 0, 0);
          this.controls.update();
        });

        document.getElementById('btn-reset-camera').addEventListener('click', () => {
          this.camera.position.set(0, 105, 115);
          this.controls.target.set(0, 2, 0);
          this.controls.update();
        });

        document.getElementById('btn-export-stl').addEventListener('click', () => this.exportSingleSTL());
        this.btnExportMulti.addEventListener('click', () => this.exportMultiColorSTL());

        document.getElementById('btn-close-map-modal').addEventListener('click', () => this.toggleSplitMapDrawer(false));

        const searchInput = document.getElementById('map-search-input');
        const runSearch = async () => {
          const q = searchInput.value.trim();
          if (!q || !this.leafletMap) return;
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
          const data = await res.json();
          if (data && data.length > 0) {
            this.leafletMap.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 15);
            const shortName = data[0].display_name.split(',')[0].toUpperCase();
            if (this.currentParams.plaqueText !== undefined) this.currentParams.plaqueText = shortName;
          }
        };
        document.getElementById('btn-map-search').addEventListener('click', runSearch);
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });

        document.getElementById('btn-load-demo-city').addEventListener('click', () => {
          this.appState.mapData = Map3DEngine.generateDemoCityData();
          this.currentParams.plaqueText = 'TORINO';
          this.currentParams.plaqueSubtext = this.appState.mapData.coordsLabel;
          this.buildSidebarControls(this.activeTool);
          this.rebuild3DModel();
        });

        document.getElementById('btn-fetch-osm-data').addEventListener('click', async () => {
          if (!this.leafletMap) return;
          const statusEl = document.getElementById('osm-fetch-status');
          const btn = document.getElementById('btn-fetch-osm-data');
          try {
            btn.disabled = true;
            statusEl.innerHTML = `<span class="text-amber-400 font-semibold">Scaricamento vettori OSM + DEM in corso...</span>`;
            const mapRect = document.getElementById('leaflet-map').getBoundingClientRect();
            const frameRect = document.getElementById('map-crop-frame').getBoundingClientRect();
            const nwLatLng = this.leafletMap.containerPointToLatLng(L.point(frameRect.left - mapRect.left, frameRect.top - mapRect.top));
            const seLatLng = this.leafletMap.containerPointToLatLng(L.point(frameRect.right - mapRect.left, frameRect.bottom - mapRect.top));
            const osmData = await Map3DEngine.fetchOSMData(L.latLngBounds(nwLatLng, seLatLng));
            this.appState.mapData = osmData;
            if (osmData.coordsLabel) this.currentParams.plaqueSubtext = osmData.coordsLabel;
            statusEl.innerHTML = `<span class="text-emerald-400">Aggiornato: ${osmData.buildings.length} edifici e DEM!</span>`;
            this.buildSidebarControls(this.activeTool);
            this.rebuild3DModel();
          } catch (err) {
            statusEl.innerHTML = `<span class="text-red-400">Area troppo estesa o server occupato: zooma di più.</span>`;
          } finally {
            btn.disabled = false;
          }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new MakerStudioApp();
    });
  </script>
</body>
</html>
