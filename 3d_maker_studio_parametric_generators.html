  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLExporter } from 'three/addons/exporters/STLExporter.js';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

    // ============================================================================
    // 0. UTILITY DI FUSIONE GEOMETRIE SICURA (Evita conflitti UV / Index in Three.js)
    // ============================================================================
    function safeMergeGeometries(geoList) {
      if (!geoList || geoList.length === 0) return null;
      const cleanedList = [];
      for (const g of geoList) {
        if (!g) continue;
        const nonIndexed = g.index ? g.toNonIndexed() : g.clone();
        const pos = nonIndexed.getAttribute('position');
        if (!pos || pos.count === 0) continue;
        const cleanGeo = new THREE.BufferGeometry();
        cleanGeo.setAttribute('position', pos);
        cleanGeo.computeVertexNormals();
        cleanedList.push(cleanGeo);
      }
      if (cleanedList.length === 0) return null;
      if (cleanedList.length === 1) return cleanedList[0];
      const merged = BufferGeometryUtils.mergeGeometries(cleanedList, false);
      if (merged) merged.computeVertexNormals();
      return merged;
    }

    // ============================================================================
    // 1. MOTORE GRAFICO PER PORTACHIAVI (Icone Vettoriali, SVG Loader e Raster-to-3D)
    // ============================================================================
    const PRESET_SVGS = {
      rocket: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 6 C65 22 72 44 72 64 L88 78 L84 85 L68 78 L62 84 L38 84 L32 78 L16 85 L12 78 L28 64 C28 44 35 22 50 6 Z M40 87 L60 87 L50 97 Z"/></svg>`,
      star: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,6 63,35 95,38 71,59 78,91 50,74 22,91 29,59 5,38 37,35"/></svg>`,
      heart: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 88 C50 88 12 62 12 34 C12 19 24 10 37 10 C45 10 50 16 50 22 C50 16 55 10 63 10 C76 10 88 19 88 34 C88 62 50 88 50 88 Z"/></svg>`,
      bolt: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="58,6 20,54 48,54 40,94 82,44 52,44"/></svg>`,
      shield: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 8 L86 22 L86 50 C86 72 50 92 50 92 C50 92 14 72 14 50 L14 22 Z"/></svg>`,
      crown: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="10,78 18,28 38,52 50,20 62,52 82,28 90,78"/></svg>`,
      paw: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="24" cy="36" r="9"/><circle cx="41" cy="24" r="9"/><circle cx="59" cy="24" r="9"/><circle cx="76" cy="36" r="9"/><path d="M50 42 C32 42 22 56 26 70 C29 80 40 82 50 82 C60 82 71 80 74 70 C78 56 68 42 50 42 Z"/></svg>`,
      gamepad: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M24 28 L76 28 C88 28 94 42 90 66 C87 78 75 80 67 68 L59 58 L41 58 L33 68 C25 80 13 78 10 66 C6 42 12 28 24 28 Z"/></svg>`
    };

    class KeychainGraphicEngine {
      // Disegna l'anteprima 2D dell'SVG sul mini-canvas laterale
      static renderSVGToPreviewCanvas(svgText, previewCanvas) {
        if (!previewCanvas || !svgText) return;
        const ctx = previewCanvas.getContext('2d');
        const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          previewCanvas.width = 64;
          previewCanvas.height = 64;
          ctx.fillStyle = '#111827';
          ctx.fillRect(0, 0, 64, 64);
          ctx.drawImage(img, 6, 6, 52, 52);
          URL.revokeObjectURL(url);
        };
        img.src = url;
      }

      // Converte una stringa SVG in una BufferGeometry 3D solida con normali corrette (senza scale negativa!)
      static buildSVGGeometry(svgText, targetSizeMm, extrudeHeightMm, previewCanvas) {
        try {
          if (previewCanvas) this.renderSVGToPreviewCanvas(svgText, previewCanvas);

          const loader = new SVGLoader();
          const svgData = loader.parse(svgText);
          const geos = [];

          svgData.paths.forEach(path => {
            let shapes = SVGLoader.createShapes(path);
            if ((!shapes || shapes.length === 0) && path.toShapes) {
              shapes = path.toShapes(true);
            }
            shapes.forEach(shape => {
              const g = new THREE.ExtrudeGeometry(shape, {
                depth: extrudeHeightMm,
                bevelEnabled: false,
                curveSegments: 18
              });
              geos.push(g);
            });
          });

          if (geos.length === 0) return null;
          const merged = safeMergeGeometries(geos);
          if (!merged) return null;

          // Ruotiamo di +90° attorno a X (determinante +1: NON inverte le facce!).
          // Così X resta a destra, Y dell'SVG (verso il basso) diventa +Z (frontale), e l'estrusione va lungo Y!
          merged.rotateX(Math.PI / 2);
          merged.computeBoundingBox();

          const bb = merged.boundingBox;
          const w = Math.max(0.001, bb.max.x - bb.min.x);
          const d = Math.max(0.001, bb.max.z - bb.min.z);
          const cx = (bb.max.x + bb.min.x) / 2;
          const cz = (bb.max.z + bb.min.z) / 2;

          // Centriamo in X e Z, portando la base inferiore esattamente a Y=0
          merged.translate(-cx, -bb.min.y, -cz);

          const scaleFactor = targetSizeMm / Math.max(w, d);
          merged.scale(scaleFactor, 1, scaleFactor);
          merged.computeVertexNormals();
          return {
            geometry: merged,
            widthMm: w * scaleFactor,
            heightMm: d * scaleFactor
          };
        } catch (e) {
          console.warn('Errore parsing SVG:', e);
          return null;
        }
      }

      // Converte un'immagine PNG/JPG in una Mesh 3D solida tramite Run-Length Voxelizer + disegna l'anteprima 2D
      static buildRasterImageGeometry(imgElement, res, threshold, invert, targetSizeMm, extrudeHeightMm, previewCanvas) {
        if (!imgElement) return null;
        const canvas = document.createElement('canvas');
        const aspect = imgElement.width / Math.max(1, imgElement.height);
        const gridW = aspect >= 1 ? res : Math.max(12, Math.round(res * aspect));
        const gridH = aspect >= 1 ? Math.max(12, Math.round(res / aspect)) : res;

        canvas.width = gridW;
        canvas.height = gridH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgElement, 0, 0, gridW, gridH);
        const imgData = ctx.getImageData(0, 0, gridW, gridH).data;

        if (previewCanvas) {
          previewCanvas.width = gridW;
          previewCanvas.height = gridH;
          const pCtx = previewCanvas.getContext('2d');
          const pData = pCtx.createImageData(gridW, gridH);
          for (let i = 0; i < imgData.length; i += 4) {
            const alpha = imgData[i + 3];
            const lum = 0.299 * imgData[i] + 0.587 * imgData[i + 1] + 0.114 * imgData[i + 2];
            const isSolid = alpha > 64 && (invert ? (lum > threshold) : (lum < threshold));
            pData.data[i] = isSolid ? 59 : 17;
            pData.data[i + 1] = isSolid ? 130 : 24;
            pData.data[i + 2] = isSolid ? 246 : 39;
            pData.data[i + 3] = 255;
          }
          pCtx.putImageData(pData, 0, 0);
        }

        const totalW = aspect >= 1 ? targetSizeMm : targetSizeMm * aspect;
        const totalD = aspect >= 1 ? targetSizeMm / aspect : targetSizeMm;
        const cellW = totalW / gridW;
        const cellD = totalD / gridH;

        const boxes = [];
        for (let y = 0; y < gridH; y++) {
          let runStart = -1;
          for (let x = 0; x <= gridW; x++) {
            let isSolid = false;
            if (x < gridW) {
              const idx = (y * gridW + x) * 4;
              const alpha = imgData[idx + 3];
              const lum = 0.299 * imgData[idx] + 0.587 * imgData[idx + 1] + 0.114 * imgData[idx + 2];
              isSolid = alpha > 64 && (invert ? (lum > threshold) : (lum < threshold));
            }

            if (isSolid && runStart === -1) {
              runStart = x;
            } else if (!isSolid && runStart !== -1) {
              const runLen = x - runStart;
              const boxW = runLen * cellW + 0.04;
              const boxD = cellD + 0.04;
              const cx = -totalW / 2 + (runStart + runLen / 2) * cellW;
              const cz = -totalD / 2 + (y + 0.5) * cellD;

              const bGeo = new THREE.BoxGeometry(boxW, extrudeHeightMm, boxD);
              bGeo.translate(cx, extrudeHeightMm / 2, cz);
              boxes.push(bGeo);
              runStart = -1;
            }
          }
        }

        if (boxes.length === 0) return null;
        const merged = safeMergeGeometries(boxes);
        if (!merged) return null;
        return {
          geometry: merged,
          widthMm: totalW,
          heightMm: totalD
        };
      }

      // Costruisce una riga di testo 3D con controllo millimetrico dello spazio tra ogni singola lettera
      static buildSpacedTextLine(str, font, sizeMm, extrudeHeightMm, letterSpacingMm) {
        if (!str || !font) return null;
        const charGeos = [];
        let cursorX = 0;

        for (let i = 0; i < str.length; i++) {
          const ch = str[i];
          if (ch === ' ') {
            cursorX += sizeMm * 0.42 + letterSpacingMm;
            continue;
          }
          const cGeo = new TextGeometry(ch, {
            font: font,
            size: sizeMm,
            height: extrudeHeightMm,
            curveSegments: 6,
            bevelEnabled: false
          });
          cGeo.computeBoundingBox();
          const bb = cGeo.boundingBox;
          const charW = Math.max(sizeMm * 0.2, bb.max.x - bb.min.x);

          cGeo.translate(cursorX - bb.min.x, 0, 0);
          charGeos.push(cGeo);
          cursorX += charW + letterSpacingMm;
        }

        if (charGeos.length === 0) return null;
        const lineGeo = safeMergeGeometries(charGeos);
        if (!lineGeo) return null;
        lineGeo.rotateX(-Math.PI / 2);
        lineGeo.computeBoundingBox();

        const bb = lineGeo.boundingBox;
        const w = bb.max.x - bb.min.x;
        const d = bb.max.z - bb.min.z;
        const cx = (bb.max.x + bb.min.x) / 2;
        const cz = (bb.max.z + bb.min.z) / 2;

        // Centra la riga attorno a (0,0) e poggia esattamente su Y=0
        lineGeo.translate(-cx, -bb.min.y, -cz);
        return { geometry: lineGeo, widthMm: w, heightMm: d };
      }
    }

    // ============================================================================
    // 2. MOTORE AUDIO (Per Generatore Soundwave)
    // ============================================================================
    class AudioWaveformProcessor {
      static generateDemoPeaks(count = 60) {
        const peaks = [];
        for (let i = 0; i < count; i++) {
          const t = i / (count - 1);
          const envelope = Math.sin(t * Math.PI);
          const wave = Math.abs(Math.sin(i * 0.45) * 0.6 + Math.cos(i * 1.1) * 0.4);
          peaks.push(Math.max(0.08, Math.min(1.0, wave * envelope * 1.15)));
        }
        return peaks;
      }

      static computePeaksFromChannelData(rawData, numBars) {
        const blockSize = Math.floor(rawData.length / numBars);
        const peaks = [];
        let maxPeak = 0.0001;
        for (let i = 0; i < numBars; i++) {
          const start = i * blockSize;
          let sum = 0;
          for (let j = 0; j < blockSize; j++) {
            const val = Math.abs(rawData[start + j] || 0);
            if (val > sum) sum = val;
          }
          peaks.push(sum);
          if (sum > maxPeak) maxPeak = sum;
        }
        return peaks.map(p => p / maxPeak);
      }
    }

    // ============================================================================
    // 3. MOTORE CARTGRAFICO 3D + ALTIMETRIA DEM
    // ============================================================================
    class Map3DEngine {
      static generateDemoElevationGrid(gridN = 12) {
        const values = [];
        for (let iz = 0; iz < gridN; iz++) {
          const row = [];
          const nz = (iz / (gridN - 1)) - 0.5;
          for (let ix = 0; ix < gridN; ix++) {
            const nx = (ix / (gridN - 1)) - 0.5;
            let h = 230;
            if (nx > -0.05) {
              const hillFactor = Math.pow((nx + 0.05) / 0.55, 1.6);
              h += hillFactor * 165 * (0.75 + 0.25 * Math.sin(nz * 5.0));
            }
            const riverDist = Math.abs(nz - (-0.20 + nx * 0.18));
            if (riverDist < 0.12) h -= (0.12 - riverDist) * 70;
            row.push(h);
          }
          values.push(row);
        }
        return { gridN, values, minElev: 222, maxElev: 395 };
      }

      static generateDemoCityData() {
        const buildings = [], parks = [], water = [], roads = [];
        water.push([
          [-0.5, -0.28], [-0.2, -0.22], [0.1, -0.30], [0.5, -0.18],
          [0.5, -0.04], [0.1, -0.16], [-0.2, -0.08], [-0.5, -0.14]
        ]);
        parks.push([[-0.16, 0.02], [0.16, 0.02], [0.16, 0.24], [-0.16, 0.24]]);
        parks.push([[-0.42, -0.44], [-0.18, -0.44], [-0.18, -0.32], [-0.42, -0.32]]);

        [-0.34, -0.18, 0.0, 0.18, 0.34].forEach((x, idx) => {
          const pts = [];
          for (let s = 0; s <= 16; s++) pts.push([x, -0.48 + (s / 16) * 0.96]);
          roads.push({ type: idx === 2 ? 'primary' : 'secondary', points: pts });
        });
        [-0.32, 0.0, 0.26].forEach((y, idx) => {
          const pts = [];
          for (let s = 0; s <= 16; s++) pts.push([-0.48 + (s / 16) * 0.96, y]);
          roads.push({ type: idx === 1 ? 'primary' : 'secondary', points: pts });
        });

        const blocksX = [[-0.45, -0.37], [-0.31, -0.21], [-0.15, -0.03], [0.03, 0.15], [0.21, 0.31], [0.37, 0.45]];
        const blocksY = [[-0.45, -0.35], [0.03, 0.23], [0.29, 0.44]];
        blocksX.forEach(([x1, x2], xi) => {
          blocksY.forEach(([y1, y2], yi) => {
            if ((yi === 1 && (xi === 2 || xi === 3)) || (yi === 0 && (xi === 0 || xi === 1))) return;
            const midY = (y1 + y2) / 2;
            const dist = Math.hypot((x1 + x2) / 2, (y1 + y2) / 2);
            buildings.push({ heightMeters: 6 + Math.round((1 - dist) * 22) + ((xi * 7 + yi * 3) % 9), footprint: [[x1, y1], [x2, y1], [x2, midY - 0.01], [x1, midY - 0.01]] });
            buildings.push({ heightMeters: 5 + Math.round((1 - dist) * 18) + ((xi * 5 + yi * 11) % 7), footprint: [[x1, midY + 0.01], [x2, midY + 0.01], [x2, y2], [x1, y2]] });
          });
        });

        return {
          buildings, parks, water, roads,
          elevationGrid: this.generateDemoElevationGrid(12),

      static async fetchRealElevationGrid(bounds, gridN = 10) {
        try {
          const s = bounds.getSouth(), w = bounds.getWest(), n = bounds.getNorth(), e = bounds.getEast();
          const lats = [], lons = [];
          for (let iz = 0; iz < gridN; iz++) {
            const lat = s + (iz / (gridN - 1)) * (n - s);
            for (let ix = 0; ix < gridN; ix++) {
              const lon = w + (ix / (gridN - 1)) * (e - w);
              lats.push(lat.toFixed(5));
              lons.push(lon.toFixed(5));
            }
          }
          const res = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats.join(',')}&longitude=${lons.join(',')}`);
          const data = await res.json();
          const values = [];
          let minElev = Infinity, maxElev = -Infinity;
          for (let iz = 0; iz < gridN; iz++) {
            const row = [];
            for (let ix = 0; ix < gridN; ix++) {
              const val = data.elevation[iz * gridN + ix];
              row.push(val);
              if (val < minElev) minElev = val;
              if (val > maxElev) maxElev = val;
            }
            values.push(row);
          }
          return { gridN, values, minElev, maxElev };
        } catch {
          return this.generateDemoElevationGrid(10);
        }
      }

      static sampleTerrainReliefMm(nx, nz, elevationGrid, terrainMode, exaggeration, maxReliefMm) {
        if (terrainMode === 'flat') return 0;
        if (terrainMode === 'synthetic-hill') {
          const hill = Math.max(0, (nx + 0.15) * 1.1) * (0.65 + 0.35 * Math.sin(nz * 4.5));
          const wave = Math.sin((nx + 0.5) * Math.PI) * Math.cos((nz * 1.5)) * 0.25;
          return Math.max(0, (hill + wave) * maxReliefMm * exaggeration * 0.5);
        }
        if (!elevationGrid || !elevationGrid.values) return 0;
        const { gridN, values, minElev, maxElev } = elevationGrid;
        const deltaMeters = Math.max(1, maxElev - minElev);
        const u = Math.max(0, Math.min(1, nx + 0.5)) * (gridN - 1);
        const v = Math.max(0, Math.min(1, nz + 0.5)) * (gridN - 1);
        const x0 = Math.floor(u), z0 = Math.floor(v);
        const x1 = Math.min(gridN - 1, x0 + 1), z1 = Math.min(gridN - 1, z0 + 1);
        const tx = u - x0, tz = v - z0;
        const h0 = values[z0][x0] * (1 - tx) + values[z0][x1] * tx;
        const h1 = values[z1][x0] * (1 - tx) + values[z1][x1] * tx;
        const elevMeters = h0 * (1 - tz) + h1 * tz;
        return Math.max(0, ((elevMeters - minElev) / Math.max(35, deltaMeters)) * maxReliefMm * exaggeration);
      }

      static buildSolidTerrainMesh(sizeX, sizeZ, baseH, shapeType, segs, getReliefFn) {
        const positions = [], indices = [];
        const clampToBoundary = (nx, nz) => {
          if (shapeType === 'circle') {
            const r = Math.hypot(nx, nz);
            if (r > 0.5) return [(nx / r) * 0.5, (nz / r) * 0.5];
          } else if (shapeType === 'hexagon') {
            const angle = Math.atan2(nz, nx), r = Math.hypot(nx, nz);
            const sector = ((angle % (Math.PI / 3)) + (Math.PI / 3)) % (Math.PI / 3);
            const maxR = 0.5 * (Math.sqrt(3) / 2) / Math.cos(sector - Math.PI / 6);
            if (r > maxR) return [Math.cos(angle) * maxR, Math.sin(angle) * maxR];
          }
          return [nx, nz];
        };

        const rowStride = segs + 1;
        for (let iz = 0; iz <= segs; iz++) {
          const rawNz = (iz / segs) - 0.5;
          for (let ix = 0; ix <= segs; ix++) {
            const rawNx = (ix / segs) - 0.5;
            const [nx, nz] = clampToBoundary(rawNx, rawNz);
            positions.push(nx * sizeX, baseH + getReliefFn(nx, nz), -nz * sizeZ);
          }
        }
        const bottomOffset = (segs + 1) * (segs + 1);
        for (let iz = 0; iz <= segs; iz++) {
          const rawNz = (iz / segs) - 0.5;
          for (let ix = 0; ix <= segs; ix++) {
            const rawNx = (ix / segs) - 0.5;
            const [nx, nz] = clampToBoundary(rawNx, rawNz);
            positions.push(nx * sizeX, 0, -nz * sizeZ);
          }
        }
        for (let iz = 0; iz < segs; iz++) {
          for (let ix = 0; ix < segs; ix++) {
            const a = iz * rowStride + ix, b = a + 1, c = (iz + 1) * rowStride + ix, d = c + 1;
            indices.push(a, b, d, a, d, c);
            const ba = bottomOffset + a, bb = bottomOffset + b, bc = bottomOffset + c, bd = bottomOffset + d;
            indices.push(ba, bd, bb, ba, bc, bd);
          }
        }
        for (let ix = 0; ix < segs; ix++) {
          const t1 = ix, t2 = ix + 1, b1 = bottomOffset + t1, b2 = bottomOffset + t2;
          indices.push(t1, b1, b2, t1, b2, t2);
          const tn1 = segs * rowStride + ix + 1, tn2 = segs * rowStride + ix, bn1 = bottomOffset + tn1, bn2 = bottomOffset + tn2;
          indices.push(tn1, bn1, bn2, tn1, bn2, tn2);
        }
        for (let iz = 0; iz < segs; iz++) {
          const t1 = (iz + 1) * rowStride, t2 = iz * rowStride, b1 = bottomOffset + t1, b2 = bottomOffset + t2;
          indices.push(t1, b1, b2, t1, b2, t2);
          const te1 = iz * rowStride + segs, te2 = (iz + 1) * rowStride + segs, be1 = bottomOffset + te1, be2 = bottomOffset + te2;
          indices.push(te1, be1, be2, te1, be2, te2);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo.toNonIndexed();
      }

      static async fetchOSMData(bounds) {
        const s = bounds.getSouth(), w = bounds.getWest(), n = bounds.getNorth(), e = bounds.getEast();
        const bboxStr = `${s},${w},${n},${e}`;
        const query = `[out:json][timeout:25];(way["building"](${bboxStr});way["highway"~"^(motorway|trunk|primary|secondary|tertiary|residential|pedestrian|living_street|unclassified|service)$"](${bboxStr});way["leisure"~"^(park|garden|pitch)$"](${bboxStr});way["landuse"~"^(grass|forest|meadow|recreation_ground)$"](${bboxStr});way["natural"="water"](${bboxStr});way["waterway"="riverbank"](${bboxStr}););out body;>;out skel qt;`;

        const [osmResponse, elevationGrid] = await Promise.all([
          fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: query }),
          this.fetchRealElevationGrid(bounds, 10)
        ]);
        if (!osmResponse.ok) throw new Error('Overpass API error');
        const json = await osmResponse.json();
        const nodes = new Map();
        json.elements.forEach(el => { if (el.type === 'node') nodes.set(el.id, [el.lon, el.lat]); });

        const centerLon = (w + e) / 2, centerLat = (s + n) / 2, spanLon = e - w, spanLat = n - s;
        const normCoord = (lon, lat) => [(lon - centerLon) / spanLon, (lat - centerLat) / spanLat];
        const buildings = [], parks = [], water = [], roads = [];

        json.elements.forEach(el => {
          if (el.type !== 'way' || !el.nodes || !el.tags) return;
          const pts = el.nodes.map(id => nodes.get(id)).filter(Boolean).map(([lon, lat]) => normCoord(lon, lat));
          if (pts.length < 2) return;
          const tags = el.tags;
          if (tags.building && pts.length >= 3) {
            let h = 7 + (el.id % 5) * 2.5;
            if (tags.height && !isNaN(parseFloat(tags.height))) h = parseFloat(tags.height);
            else if (tags['building:levels'] && !isNaN(parseFloat(tags['building:levels']))) h = parseFloat(tags['building:levels']) * 3.2;
            buildings.push({ heightMeters: h, footprint: pts });
          } else if ((tags.leisure || tags.landuse) && pts.length >= 3) parks.push(pts);
          else if ((tags.natural === 'water' || tags.waterway) && pts.length >= 3) water.push(pts);
          else if (tags.highway) {
            const hw = tags.highway;
            let roadType = 'residential';
            if (['motorway', 'trunk', 'primary'].includes(hw)) roadType = 'primary';
            else if (['secondary', 'tertiary'].includes(hw)) roadType = 'secondary';
            else if (['service', 'pedestrian', 'living_street'].includes(hw)) roadType = 'minor';
            roads.push({ type: roadType, points: pts });
          }
        });

        const coordsLabel = `${Math.abs(centerLat).toFixed(3)}° ${centerLat >= 0 ? 'N' : 'S'}, ${Math.abs(centerLon).toFixed(3)}° ${centerLon >= 0 ? 'E' : 'W'}`;
        return { buildings, parks, water, roads, elevationGrid, sourceName: `OSM (${coordsLabel})`, coordsLabel };
      }

      static isPointInsideShape(nx, nz, shapeType, marginFactor = 0.97) {
        const x = nx / marginFactor, z = nz / marginFactor;
        if (shapeType === 'circle') return (x * x + z * z) <= 0.25;
        if (shapeType === 'hexagon') {
          const qx = Math.abs(x), qz = Math.abs(z);
          return qz <= 0.433 && (qx * 0.866 + qz * 0.5) <= 0.433;
        }
        return Math.abs(x) <= 0.5 && Math.abs(z) <= 0.5;
      }
    }

              const gapZ = Number(params.lineSpacing);
              const totalD = l1.heightMm + gapZ + l2.heightMm;
              l1.geometry.translate(0, 0, -totalD / 2 + l1.heightMm / 2);
              l2.geometry.translate(0, 0, totalD / 2 - l2.heightMm / 2);
              textBlockGeo = safeMergeGeometries([l1.geometry, l2.geometry]);
              textW = Math.max(l1.widthMm, l2.widthMm);
              textD = totalD;
            } else if (l1) {
              textBlockGeo = l1.geometry;
              textW = l1.widthMm;
              textD = l1.heightMm;
            } else if (l2) {
              textBlockGeo = l2.geometry;
              textW = l2.widthMm;
              textD = l2.heightMm;
            }
          }

          // 2. COSTRUZIONE BLOCCO GRAFICO (SVG Upload, Raster Image Upload, oppure Icona Preset)
          let graphicBlockGeo = null;
          let graphW = 0, graphD = 0;

          if (params.contentMode !== 'text-only') {
            const gSize = Number(params.graphicSizeMm);
            const extrudeG = isFlushInlay ? 0.6 : graphicRelief;
            const previewCanvas = document.getElementById('raster-preview-canvas');
            let gRes = null;

            if (params.graphicSource === 'svg-upload' && state.customSvgText) {
              gRes = KeychainGraphicEngine.buildSVGGeometry(state.customSvgText, gSize, extrudeG, previewCanvas);
            } else if (params.graphicSource === 'raster-upload' && state.customRasterImage) {
              gRes = KeychainGraphicEngine.buildRasterImageGeometry(
                state.customRasterImage,
                Number(params.rasterResolution),
                Number(params.rasterThreshold),
                Boolean(params.rasterInvert),
                gSize,
                extrudeG,
                previewCanvas
              );
            } else {
              const svgMarkup = PRESET_SVGS[params.presetIcon] || PRESET_SVGS.rocket;
              gRes = KeychainGraphicEngine.buildSVGGeometry(svgMarkup, gSize, extrudeG, previewCanvas);
            }

            if (gRes) {
              graphicBlockGeo = gRes.geometry;
              graphW = gRes.widthMm;
              graphD = gRes.heightMm;
            }
          }

          // 3. CALCOLO LAYOUT COMBINATO (Logo + Testo) E POSIZIONAMENTO PULITO SU Y = baseH
          const gap = Number(params.graphicGapMm);
          let contentSpanX = 20, contentSpanZ = 14;

          // Poggia esattamente sopra la superficie della piastra (Y = baseH) evitando compenetrazioni
          const yElevationText = isFlushInlay ? (baseH - 0.58) : baseH;
          const yElevationGraphic = isFlushInlay ? (baseH - 0.58) : baseH;

          // Se c'è un foro interno, spostiamo leggermente il contenuto per non sovrapporlo al foro
          const holeTotalSpan = Number(params.holeDiameter) + Number(params.holeRimWidth) * 2;
          const innerHoleShiftX = (params.holeStyle === 'inner-hole' && params.holePosition === 'left')
            ? (holeTotalSpan * 0.45)
            : (params.holeStyle === 'inner-hole' && params.holePosition === 'right')
              ? (-holeTotalSpan * 0.45)
              : 0;
          const innerHoleShiftZ = (params.holeStyle === 'inner-hole' && params.holePosition === 'top')
            ? (holeTotalSpan * 0.45)
            : 0;

          if (textBlockGeo && graphicBlockGeo) {
            const layout = params.graphicLayout;
            if (layout === 'left') {
              contentSpanX = graphW + gap + textW;
              contentSpanZ = Math.max(graphD, textD);
              const gx = -contentSpanX / 2 + graphW / 2 + Number(params.graphicOffsetX) + innerHoleShiftX;
              const tx = contentSpanX / 2 - textW / 2 + Number(params.textOffsetX) + innerHoleShiftX;
              graphicBlockGeo.translate(gx, yElevationGraphic, -Number(params.graphicOffsetY) + innerHoleShiftZ);
              textBlockGeo.translate(tx, yElevationText, -Number(params.textOffsetY) + innerHoleShiftZ);
            } else if (layout === 'right') {
              contentSpanX = textW + gap + graphW;
              contentSpanZ = Math.max(graphD, textD);
              const tx = -contentSpanX / 2 + textW / 2 + Number(params.textOffsetX) + innerHoleShiftX;
              const gx = contentSpanX / 2 - graphW / 2 + Number(params.graphicOffsetX) + innerHoleShiftX;
              textBlockGeo.translate(tx, yElevationText, -Number(params.textOffsetY) + innerHoleShiftZ);
              graphicBlockGeo.translate(gx, yElevationGraphic, -Number(params.graphicOffsetY) + innerHoleShiftZ);
            } else if (layout === 'top') {
              contentSpanX = Math.max(graphW, textW);
              contentSpanZ = graphD + gap + textD;
              const gz = -contentSpanZ / 2 + graphD / 2 - Number(params.graphicOffsetY) + innerHoleShiftZ;
              const tz = contentSpanZ / 2 - textD / 2 - Number(params.textOffsetY) + innerHoleShiftZ;
              graphicBlockGeo.translate(Number(params.graphicOffsetX) + innerHoleShiftX, yElevationGraphic, gz);
              textBlockGeo.translate(Number(params.textOffsetX) + innerHoleShiftX, yElevationText, tz);
            } else if (layout === 'bottom') {
              contentSpanX = Math.max(graphW, textW);
              contentSpanZ = textD + gap + graphD;
              const tz = -contentSpanZ / 2 + textD / 2 - Number(params.textOffsetY) + innerHoleShiftZ;
              const gz = contentSpanZ / 2 - graphD / 2 - Number(params.graphicOffsetY) + innerHoleShiftZ;
              textBlockGeo.translate(Number(params.textOffsetX) + innerHoleShiftX, yElevationText, tz);
              graphicBlockGeo.translate(Number(params.graphicOffsetX) + innerHoleShiftX, yElevationGraphic, gz);
            } else {
              contentSpanX = Math.max(graphW, textW) + 10;
              contentSpanZ = Math.max(graphD, textD) + 6;
              graphicBlockGeo.translate(Number(params.graphicOffsetX), yElevationGraphic, -Number(params.graphicOffsetY));
              textBlockGeo.translate(Number(params.textOffsetX), yElevationText, -Number(params.textOffsetY));
            }
            parts.graphic.push(graphicBlockGeo);
            parts.text.push(textBlockGeo);
          } else if (textBlockGeo) {
            contentSpanX = textW;
            contentSpanZ = textD;
            textBlockGeo.translate(Number(params.textOffsetX) + innerHoleShiftX, yElevationText, -Number(params.textOffsetY) + innerHoleShiftZ);
            parts.text.push(textBlockGeo);
          } else if (graphicBlockGeo) {
            contentSpanX = graphW;
            contentSpanZ = graphD;
            graphicBlockGeo.translate(Number(params.graphicOffsetX) + innerHoleShiftX, yElevationGraphic, -Number(params.graphicOffsetY) + innerHoleShiftZ);
            parts.graphic.push(graphicBlockGeo);
          }

          // 4. CALCOLO DIMENSIONI E FORMA PIASTRA BASE (Auto-Fit oppure Manuale)
          const shapeMode = params.plateShape;
          const borderExtra = params.hasBorderRim ? Number(params.borderWidth) * 2 : 0;
          const holeInnerExtraX = (params.holeStyle === 'inner-hole' && (params.holePosition === 'left' || params.holePosition === 'right'))
            ? (holeTotalSpan + 2)
            : 0;
          const holeInnerExtraZ = (params.holeStyle === 'inner-hole' && params.holePosition === 'top')
            ? (holeTotalSpan + 2)
            : 0;

          let plateW = Number(params.plateWidth);
          let plateD = Number(params.plateHeight);

          if (shapeMode === 'auto-pill' || shapeMode === 'auto-rect') {
            plateW = Math.max(24, contentSpanX + Number(params.autoMarginX) * 2 + borderExtra + holeInnerExtraX);
            plateD = Math.max(18, contentSpanZ + Number(params.autoMarginY) * 2 + borderExtra + holeInnerExtraZ);
          } else if (shapeMode === 'circle' || shapeMode === 'hexagon') {
            plateD = plateW;
          }

          // Costruisce la Shape 2D con +Y = Alto (-Z in 3D) e -Y = Basso (+Z in 3D)
          const buildPlate2DShape = (w, d, shrink = 0) => {
            const s = new THREE.Shape();
            const hw = Math.max(2, w / 2 - shrink);
            const hd = Math.max(2, d / 2 - shrink);

            if (shapeMode === 'circle') {
              s.absarc(0, 0, hw, 0, Math.PI * 2, false);
            } else if (shapeMode === 'hexagon') {
              for (let i = 0; i < 6; i++) {
                const a = (Math.PI / 3) * i;
                if (i === 0) s.moveTo(hw * Math.cos(a), hd * Math.sin(a));
                else s.lineTo(hw * Math.cos(a), hd * Math.sin(a));
              }
              s.closePath();
            } else if (shapeMode === 'shield') {
              // Scudo con parte alta a +hd e punta inferiore a -hd
              s.moveTo(-hw, hd * 0.82);
              s.lineTo(0, hd);
              s.lineTo(hw, hd * 0.82);
              s.lineTo(hw, -hd * 0.15);
              s.quadraticCurveTo(hw * 0.82, -hd * 0.75, 0, -hd);
              s.quadraticCurveTo(-hw * 0.82, -hd * 0.75, -hw, -hd * 0.15);
              s.closePath();
            } else if (shapeMode === 'dog-tag') {
              const chamfer = Math.max(1.5, Math.min(hw, hd) * 0.36);
              s.moveTo(-hw + chamfer, -hd);
              s.lineTo(hw - chamfer, -hd);
              s.lineTo(hw, -hd + chamfer);
              s.lineTo(hw, hd - chamfer);
              s.lineTo(hw - chamfer, hd);
              s.lineTo(-hw + chamfer, hd);
              s.lineTo(-hw, hd - chamfer);
              s.lineTo(-hw, -hd + chamfer);
              s.closePath();
            } else {
              // Rounded Rect o Pill/Capsule
              const isPill = (shapeMode === 'pill' || shapeMode === 'auto-pill');
              const r = isPill
                ? Math.min(hw, hd)
                : Math.min(hw - 0.5, hd - 0.5, Math.max(0.8, Number(params.cornerRadius) - shrink));
              s.moveTo(-hw + r, -hd);
              s.lineTo(hw - r, -hd);
              s.quadraticCurveTo(hw, -hd, hw, -hd + r);
              s.lineTo(hw, hd - r);
              s.quadraticCurveTo(hw, hd, hw - r, hd);
              s.lineTo(-hw + r, hd);
              s.quadraticCurveTo(-hw, hd, -hw, hd - r);
              s.lineTo(-hw, -hd + r);
              s.quadraticCurveTo(-hw, -hd, -hw + r, -hd);
            }
            return s;
          };

          const baseShape = buildPlate2DShape(plateW, plateD, 0);

          // Calcolo coordinate del foro portachiavi in 2D (+Y = Top, -X = Left)
          const holeR = Number(params.holeDiameter) / 2;
          const rimW = Number(params.holeRimWidth);
          const outerR = holeR + rimW;
          const hOffset = Number(params.holeOffsetMm);
          const bw = params.hasBorderRim ? Number(params.borderWidth) : 0;

          const getHoleCoords = (pos, isInner) => {
            const hw = plateW / 2;
            const hd = plateD / 2;
            if (isInner) {
              const inset = outerR + bw + 0.8 - hOffset;
              if (pos === 'top') return [0, hd - inset];
              if (pos === 'right') return [hw - inset, 0];
              if (pos === 'top-left') return [-hw + inset, hd - inset * 0.85];
              return [-hw + inset, 0]; // left
            } else {
              // Raccordo tangente al bordo esterno così l'anello NON penetra mai dentro l'area interna del portachiavi
              const outDist = outerR - Math.min(rimW * 0.45, Math.max(0.8, bw * 0.6)) + hOffset;
              if (pos === 'top') return [0, hd + outDist];
              if (pos === 'right') return [hw + outDist, 0];
              if (pos === 'top-left') {
                const isPill = (shapeMode === 'pill' || shapeMode === 'auto-pill');
                const cr = isPill ? Math.min(hw, hd) : Math.min(hw, hd, Number(params.cornerRadius));
                const diag = outDist * 0.707;
                return [-hw + cr * 0.25 - diag, hd - cr * 0.25 + diag];
              }
              return [-hw - outDist, 0]; // left
            }
          };

          // Se lo stile è "inner-hole", foriamo direttamente la Shape 2D della piastra
          if (params.holeStyle === 'inner-hole') {
            const [hx, hy] = getHoleCoords(params.holePosition, true);
            const holePath = new THREE.Path();
            holePath.absarc(hx, hy, holeR, 0, Math.PI * 2, true);
            baseShape.holes.push(holePath);

            // Bordino di rinforzo sopra il foro interno: poggia a Y=baseH senza compenetrare la base
            if (params.hasBorderRim) {
              const collarShape = new THREE.Shape();
              collarShape.absarc(hx, hy, outerR, 0, Math.PI * 2, false);
              const cHole = new THREE.Path();
              cHole.absarc(hx, hy, holeR, 0, Math.PI * 2, true);
              collarShape.holes.push(cHole);
              const collarH = Number(params.borderReliefMm);
              const collarGeo = new THREE.ExtrudeGeometry(collarShape, { depth: collarH, bevelEnabled: false, curveSegments: 32 });
              collarGeo.rotateX(-Math.PI / 2);
              collarGeo.translate(0, baseH, 0);
              parts.border.push(collarGeo);
            }
          }

          // Estrusione Piastra Base: con rotateX(-Math.PI / 2) va da Y=0 a Y=baseH
          const baseGeo = new THREE.ExtrudeGeometry(baseShape, { depth: baseH, bevelEnabled: false, curveSegments: 48 });
          baseGeo.rotateX(-Math.PI / 2);
          parts.base.push(baseGeo);

          // 5. BORDO PERIMETRALE A RILIEVO (Poggia esattamente a Y=baseH -> Y=baseH+bh, ZERO compenetrazione!)
          if (params.hasBorderRim) {
            const bh = Number(params.borderReliefMm);
            const rimOuter = buildPlate2DShape(plateW, plateD, 0);
            const rimInner = buildPlate2DShape(plateW, plateD, bw);
            rimOuter.holes.push(rimInner);

            const rimGeo = new THREE.ExtrudeGeometry(rimOuter, { depth: bh, bevelEnabled: false, curveSegments: 48 });
            rimGeo.rotateX(-Math.PI / 2);
            rimGeo.translate(0, baseH, 0);
            parts.border.push(rimGeo);
          }

          // 6. ANELLO SPORGENTE ESTERNO (Singolo o Doppio SX+DX)
          const buildOuterEar = (hx, hy) => {
            const earShape = new THREE.Shape();
            earShape.absarc(hx, hy, outerR, 0, Math.PI * 2, false);
            const earHole = new THREE.Path();
            earHole.absarc(hx, hy, holeR, 0, Math.PI * 2, true);
            earShape.holes.push(earHole);

            const earGeo = new THREE.ExtrudeGeometry(earShape, { depth: baseH, bevelEnabled: false, curveSegments: 36 });
            earGeo.rotateX(-Math.PI / 2);
            parts.base.push(earGeo);

            if (params.hasBorderRim) {
              const bh = Number(params.borderReliefMm);
              const earRimGeo = new THREE.ExtrudeGeometry(earShape, { depth: bh, bevelEnabled: false, curveSegments: 36 });
              earRimGeo.rotateX(-Math.PI / 2);
              earRimGeo.translate(0, baseH, 0);
              parts.border.push(earRimGeo);
            }
          };

          if (params.holeStyle === 'outer-tab') {
            const [hx, hy] = getHoleCoords(params.holePosition, false);
            buildOuterEar(hx, hy);
          } else if (params.holeStyle === 'dual-ears') {
            const [lx, ly] = getHoleCoords('left', false);
            const [rx, ry] = getHoleCoords('right', false);
            buildOuterEar(lx, ly);
            buildOuterEar(rx, ry);
          }

          // 7. UNIONE SICURA PER CANALE COLORE
          const colorMap = {
            base: params.colorBase,
            border: params.colorBorder,
            text: params.colorText,
            graphic: params.colorGraphic
          };

          Object.keys(parts).forEach(partName => {
            const list = parts[partName];
            if (list.length === 0) return;
            const merged = safeMergeGeometries(list);
            if (!merged) return;
            const mat = new THREE.MeshStandardMaterial({
              color: new THREE.Color(colorMap[partName]),
              roughness: 0.32,
              metalness: 0.12
            });
            const m = new THREE.Mesh(merged, mat);
            m.name = partName;
            m.castShadow = true;
            m.receiveShadow = true;
            group.add(m);
          });

          return group;
        }
      },
